<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Nookly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="dashboard" class="min-h-screen bg-background text-foreground antialiased">
  <div data-include="partials/icons.html"></div>
  <main class="min-h-screen bg-background text-foreground">
    <div data-include="partials/header-marketplace.html"></div>
    <div class="mx-auto grid max-w-7xl gap-8 px-5 py-8 lg:grid-cols-[220px_1fr] lg:px-8 lg:py-12">
      <div data-include="partials/sidebar-marketplace.html"></div>
      <section>
        <div class="mb-8">
          <p class="mb-2 text-xs font-bold uppercase tracking-[0.18em] text-primary">Your Nookly</p>
          <h1 class="font-mono text-4xl font-bold tracking-[-0.06em]">Your dashboard</h1>
          <p class="mt-3 max-w-2xl leading-relaxed text-muted-foreground">Keep track of your saved pros, upcoming help, and your next task.</p>
        </div>
        <div class="flex flex-col gap-6">
          <div class="grid gap-4 sm:grid-cols-3">
            <div class="rounded-2xl bg-primary p-5 text-primary-foreground"><svg class="size-5" aria-hidden="true"><use href="#i-calendar-check"/></svg><p class="mt-8 text-3xl font-bold">0</p><p class="mt-1 text-sm opacity-80">Upcoming bookings</p></div>
            <div class="rounded-2xl border border-border bg-card p-5"><svg class="size-5 text-primary" aria-hidden="true"><use href="#i-heart"/></svg><p class="mt-8 text-3xl font-bold" id="saved-count">0</p><p class="mt-1 text-sm text-muted-foreground">Saved businesses</p></div>
            <div class="rounded-2xl border border-border bg-card p-5"><svg class="size-5 text-primary" aria-hidden="true"><use href="#i-sparkles"/></svg><p class="mt-8 text-3xl font-bold" id="featured-count">0</p><p class="mt-1 text-sm text-muted-foreground">Featured nearby</p></div>
          </div>
          <div class="rounded-2xl border border-border bg-card p-6">
            <div class="flex items-center justify-between">
              <div><h2 class="font-mono text-xl font-bold">Find your next pro</h2><p class="mt-1 text-sm text-muted-foreground">Trusted help is a few clicks away.</p></div>
              <a href="index.html#services" class="flex items-center gap-2 text-sm font-semibold text-primary">Browse <svg class="size-4" aria-hidden="true"><use href="#i-arrow-right"/></svg></a>
            </div>
            <div class="mt-5 flex items-center gap-3 rounded-xl bg-muted px-4 py-3 text-sm text-muted-foreground"><svg class="size-4" aria-hidden="true"><use href="#i-search"/></svg>Search cleaning, moving, repairs...</div>
          </div>
          <div>
            <h2 class="font-mono text-xl font-bold">Recommended for you</h2>
            <div class="mt-4 grid gap-4 md:grid-cols-2" id="recommended-grid"></div>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/device-id.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/include.js"></script>
  <script>
    async function load() {
      try {
        const fav = await apiGet('/favorites?deviceId=' + getDeviceId())
        document.getElementById('saved-count').textContent = (fav.data.favorites || []).length
      } catch {}
      const grid = document.getElementById('recommended-grid')
      grid.innerHTML = '<div class="rounded-2xl border border-dashed border-border py-14 text-center text-muted-foreground md:col-span-2">Loading…</div>'
      try {
        const { data } = await apiGet('/businesses/featured?limit=3')
        const items = data.data || []
        document.getElementById('featured-count').textContent = items.length
        grid.innerHTML = ''
        if (!items.length) {
          grid.innerHTML = '<div class="rounded-2xl border border-dashed border-border py-14 text-center text-muted-foreground md:col-span-2">Nothing featured yet — check back soon.</div>'
          return
        }
        items.forEach((b) => grid.appendChild(renderBusinessCard(b)))
      } catch (err) {
        grid.innerHTML = '<div class="rounded-2xl border border-dashed border-border py-14 text-center text-muted-foreground md:col-span-2">Could not load recommendations.</div>'
      }
    }
    load()
  </script>
</body>
</html>
