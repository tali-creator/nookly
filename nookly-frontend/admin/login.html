<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin portal — Nookly</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="min-h-screen bg-background text-foreground antialiased">
  <div data-include="../partials/icons.html"></div>
  <main class="flex min-h-screen items-center justify-center bg-background px-5 py-10">
    <div class="w-full max-w-md">
      <a href="../index.html" class="mb-10 flex items-center justify-center gap-2 font-mono text-xl font-bold">
        <span class="flex size-9 items-center justify-center rounded-xl bg-primary text-primary-foreground"><svg class="size-5" aria-hidden="true"><use href="#i-sparkles"/></svg></span>nookly
      </a>
      <div class="rounded-3xl border border-border bg-card p-7 shadow-sm">
        <p class="text-xs font-bold uppercase tracking-[.18em] text-primary">admin portal</p>
        <h1 class="mt-3 font-mono text-3xl font-bold">Welcome back</h1>
        <p class="mt-3 text-sm leading-relaxed text-muted-foreground">Sign in as an administrator.</p>
        <p class="mt-5 hidden rounded-xl bg-red-50 p-3 text-sm text-red-600" id="message"></p>
        <div class="mt-7 flex flex-col gap-4" id="role-form">
          <input id="email" placeholder="Email address" type="email" autocomplete="username" class="rounded-xl border border-border bg-background px-4 py-3 outline-none focus:ring-2 focus:ring-primary" />
          <input id="password" placeholder="Password" type="password" autocomplete="current-password" class="rounded-xl border border-border bg-background px-4 py-3 outline-none focus:ring-2 focus:ring-primary" />
          <button id="continue-btn" class="flex items-center justify-center gap-2 rounded-xl bg-primary py-3 font-bold text-primary-foreground transition hover:opacity-90">Continue <svg class="size-4" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
        </div>
        <a href="../login.html" class="mt-4 block text-center text-sm font-bold text-primary hover:underline">Back to customer login</a>
      </div>
    </div>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/include.js"></script>
  <script>
    const btn = document.getElementById('continue-btn')
    const msg = document.getElementById('message')

    const existing = getUser()
    if (existing && existing.role === 'ADMIN' && getToken()) {
      window.location.replace('dashboard.html')
    }

    function showMessage(text) {
      msg.textContent = text
      msg.classList.remove('hidden')
    }

    btn.addEventListener('click', async function () {
      msg.classList.add('hidden')
      btn.disabled = true
      btn.textContent = 'Signing in…'
      try {
        const { data } = await apiPost('/auth/login', {
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        })
        saveSession(data.user, data.token)
        if (data.user.role !== 'ADMIN') {
          clearSession()
          showMessage('This account is not an administrator.')
          btn.disabled = false
          btn.textContent = 'Continue'
          return
        }
        window.location.href = 'dashboard.html'
      } catch (err) {
        showMessage(err.message || 'Login failed. Please try again.')
        btn.disabled = false
        btn.textContent = 'Continue'
      }
    })
  </script>
</body>
</html>
