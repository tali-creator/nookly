<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business review — Nookly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body data-page="moderation" class="min-h-screen bg-background text-foreground antialiased">
  <div data-include="../partials/icons.html"></div>
  <main class="min-h-screen bg-background text-foreground">
    <div data-include="../partials/header-marketplace.html"></div>
    <div class="mx-auto grid max-w-7xl gap-8 px-5 py-8 lg:grid-cols-[220px_1fr] lg:px-8 lg:py-12">
      <div data-include="../partials/sidebar-admin.html"></div>
      <section>
        <div class="mb-8">
          <p class="mb-2 text-xs font-bold uppercase tracking-[0.18em] text-primary">Admin console</p>
          <a href="dashboard.html" class="mb-2 inline-block text-sm font-semibold text-primary hover:underline">&larr; Back to moderation queue</a>
          <h1 class="font-mono text-4xl font-bold tracking-[-0.06em]" id="business-name">Business review</h1>
          <p class="mt-3 max-w-2xl leading-relaxed text-muted-foreground" id="business-sub">Loading…</p>
        </div>
        <p class="mb-6 hidden rounded-xl bg-red-50 p-3 text-sm text-red-600" id="message"></p>

        <div class="flex flex-col gap-6">
          <div class="rounded-2xl border border-border bg-card p-6">
            <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
              <div class="flex items-center gap-2 flex-wrap">
                <h2 class="font-mono text-xl font-bold">Details</h2>
                <span id="status-badge" class="rounded-full px-2.5 py-1 text-xs font-bold"></span>
                <span id="featured-badge" class="hidden rounded-full bg-amber-100 px-2.5 py-1 text-xs font-bold text-amber-800">Featured</span>
              </div>
              <div class="flex flex-wrap gap-2" id="actions"></div>
            </div>
            <p id="moderation-note" class="mt-3 hidden rounded-xl bg-red-50 p-3 text-sm text-red-700"></p>
            <dl class="mt-5 grid gap-x-8 gap-y-3 text-sm sm:grid-cols-2">
              <div class="flex justify-between gap-4 border-b border-border pb-2"><dt class="text-muted-foreground">Owner</dt><dd id="d-owner" class="font-semibold">—</dd></div>
              <div class="flex justify-between gap-4 border-b border-border pb-2"><dt class="text-muted-foreground">Category</dt><dd id="d-category" class="font-semibold">—</dd></div>
              <div class="flex justify-between gap-4 border-b border-border pb-2"><dt class="text-muted-foreground">Address</dt><dd id="d-address" class="font-semibold">—</dd></div>
              <div class="flex justify-between gap-4 border-b border-border pb-2"><dt class="text-muted-foreground">Phone</dt><dd id="d-phone" class="font-semibold">—</dd></div>
              <div class="flex justify-between gap-4 border-b border-border pb-2"><dt class="text-muted-foreground">WhatsApp</dt><dd id="d-whatsapp" class="font-semibold">—</dd></div>
              <div class="flex justify-between gap-4 border-b border-border pb-2"><dt class="text-muted-foreground">Coordinates</dt><dd id="d-coords" class="font-semibold">—</dd></div>
              <div class="flex justify-between gap-4 border-b border-border pb-2 sm:col-span-2"><dt class="text-muted-foreground">Description</dt><dd id="d-description" class="font-semibold">—</dd></div>
            </dl>
          </div>

          <div class="rounded-2xl border border-border bg-card p-6">
            <h2 class="font-mono text-xl font-bold">Services</h2>
            <div class="mt-4 flex flex-col gap-2" id="service-list"></div>
          </div>

          <div class="rounded-2xl border border-border bg-card p-6">
            <h2 class="font-mono text-xl font-bold">Photos</h2>
            <div class="mt-4 grid grid-cols-3 gap-3 sm:grid-cols-6" id="photo-grid"></div>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/helpers.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/include.js"></script>
  <script>
    if (requireAdmin()) throw new Error('redirecting')

    const businessId = new URLSearchParams(window.location.search).get('id')
    let business = null

    const STATUS_STYLES = {
      PENDING: 'bg-amber-100 text-amber-800',
      APPROVED: 'bg-primary/15 text-primary',
      REJECTED: 'bg-red-100 text-red-700',
      SUSPENDED: 'bg-muted text-muted-foreground',
    }

    function showMessage(text) {
      const m = document.getElementById('message')
      m.textContent = text
      m.classList.remove('hidden')
    }

    async function load() {
      if (!businessId) { showMessage('No business selected.'); return }
      try {
        const { data } = await apiGet('/admin/businesses/' + businessId)
        render(data.business)
      } catch (err) {
        showMessage(err.message || 'Could not load business.')
      }
    }

    function render(b) {
      business = b
      document.getElementById('business-name').textContent = b.name
      document.getElementById('business-sub').textContent = 'Review and manage this listing.'
      const badge = document.getElementById('status-badge')
      badge.textContent = b.status
      badge.className = 'rounded-full px-2.5 py-1 text-xs font-bold ' + (STATUS_STYLES[b.status] || 'bg-muted text-muted-foreground')
      if (b.isFeatured) document.getElementById('featured-badge').classList.remove('hidden')
      const note = document.getElementById('moderation-note')
      if (b.moderationNote) {
        note.textContent = 'Moderation note: ' + b.moderationNote
        note.classList.remove('hidden')
      }
      document.getElementById('d-owner').textContent = b.owner ? b.owner.email : '—'
      document.getElementById('d-category').textContent = b.category ? b.category.name : '—'
      document.getElementById('d-address').textContent = b.address || '—'
      document.getElementById('d-phone').textContent = b.phone || '—'
      document.getElementById('d-whatsapp').textContent = b.whatsappNumber || '—'
      document.getElementById('d-coords').textContent = (b.lat != null && b.lng != null) ? b.lat.toFixed(4) + ', ' + b.lng.toFixed(4) : '—'
      document.getElementById('d-description').textContent = b.description || '—'

      const svc = document.getElementById('service-list')
      svc.innerHTML = ''
      if (!(b.serviceItems || []).length) {
        svc.innerHTML = '<p class="text-sm text-muted-foreground">No services listed.</p>'
      } else {
        b.serviceItems.forEach((s) => {
          const row = document.createElement('div')
          row.className = 'flex items-center justify-between rounded-xl border border-border px-4 py-3 text-sm'
          row.innerHTML = '<span class="font-semibold">' + escapeHtml(s.name) + '</span><span class="font-mono font-bold">' + formatNaira(parsePrice(s.price)) + '</span>'
          svc.appendChild(row)
        })
      }

      const grid = document.getElementById('photo-grid')
      grid.innerHTML = ''
      if (!(b.photos || []).length) {
        grid.innerHTML = '<p class="col-span-full text-sm text-muted-foreground">No photos uploaded.</p>'
      } else {
        b.photos.forEach((p) => {
          const el = document.createElement('img')
          el.src = imageUrl(p.url)
          el.alt = 'Business photo'
          el.className = 'aspect-square w-full rounded-xl object-cover'
          grid.appendChild(el)
        })
      }

      const actions = document.getElementById('actions')
      actions.innerHTML = ''
      if (b.status !== 'APPROVED') {
        const btn = document.createElement('button')
        btn.className = 'rounded-lg bg-primary px-4 py-2 text-sm font-bold text-primary-foreground'
        btn.textContent = 'Approve'
        btn.addEventListener('click', act('approve'))
        actions.appendChild(btn)
      }
      if (b.status !== 'APPROVED' && b.status !== 'REJECTED') {
        const btn = document.createElement('button')
        btn.className = 'rounded-lg border border-border px-4 py-2 text-sm font-bold'
        btn.textContent = 'Reject'
        btn.addEventListener('click', act('reject'))
        actions.appendChild(btn)
      }
      if (b.status === 'APPROVED') {
        const btn = document.createElement('button')
        btn.className = 'rounded-lg border border-border px-4 py-2 text-sm font-bold'
        btn.textContent = 'Suspend'
        btn.addEventListener('click', act('suspend'))
        actions.appendChild(btn)
      }
      if (b.status === 'APPROVED' && !b.isFeatured) {
        const btn = document.createElement('button')
        btn.className = 'rounded-lg border border-border px-4 py-2 text-sm font-bold'
        btn.textContent = 'Feature'
        btn.addEventListener('click', act('feature'))
        actions.appendChild(btn)
      }
      if (b.isFeatured) {
        const btn = document.createElement('button')
        btn.className = 'rounded-lg border border-border px-4 py-2 text-sm font-bold'
        btn.textContent = 'Unfeature'
        btn.addEventListener('click', act('unfeature'))
        actions.appendChild(btn)
      }
    }

    function act(kind) {
      return async function () {
        try {
          if (kind === 'reject' || kind === 'suspend') {
            const reason = prompt(kind === 'reject' ? 'Rejection reason (10+ characters):' : 'Suspension reason (10+ characters):')
            if (reason === null) return
            const { data } = await apiPatch('/admin/businesses/' + businessId + '/' + kind, { reason })
            render(data.business)
          } else if (kind === 'feature') {
            const days = prompt('Feature duration in days (blank for indefinite):')
            const body = days && days.trim() !== '' ? { durationDays: parseInt(days, 10) } : {}
            const { data } = await apiPatch('/admin/businesses/' + businessId + '/feature', body)
            render(data.business)
          } else {
            const { data } = await apiPatch('/admin/businesses/' + businessId + '/' + kind)
            render(data.business)
          }
        } catch (err) {
          showMessage(err.message || 'Action failed')
        }
      }
    }

    load()
  </script>
</body>
</html>
