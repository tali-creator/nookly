<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users — Nookly admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body data-page="users" class="min-h-screen bg-background text-foreground antialiased">
  <div data-include="../partials/icons.html"></div>
  <main class="min-h-screen bg-background text-foreground">
    <div data-include="../partials/header-marketplace.html"></div>
    <div class="mx-auto grid max-w-7xl gap-8 px-5 py-8 lg:grid-cols-[220px_1fr] lg:px-8 lg:py-12">
      <div data-include="../partials/sidebar-admin.html"></div>
      <section>
        <div class="mb-8">
          <p class="mb-2 text-xs font-bold uppercase tracking-[0.18em] text-primary">Admin console</p>
          <h1 class="font-mono text-4xl font-bold tracking-[-0.06em]">Registered users</h1>
          <p class="mt-3 max-w-2xl leading-relaxed text-muted-foreground">Browse every account on Nookly — owners and admins. Open a user to see their businesses and KYC status.</p>
        </div>
        <p class="mb-6 hidden rounded-xl bg-red-50 p-3 text-sm text-red-600" id="message"></p>

        <div class="flex flex-col gap-4">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap gap-2" id="filter-tabs">
              <button class="filter-btn rounded-full px-4 py-2 text-sm font-bold" data-role="" data-kyc="" data-deleted="false">All</button>
              <button class="filter-btn rounded-full px-4 py-2 text-sm font-bold" data-role="BUSINESS_OWNER" data-kyc="" data-deleted="false">Owners</button>
              <button class="filter-btn rounded-full px-4 py-2 text-sm font-bold" data-role="ADMIN" data-kyc="" data-deleted="false">Admins</button>
              <button class="filter-btn rounded-full px-4 py-2 text-sm font-bold" data-role="BUSINESS_OWNER" data-kyc="VERIFIED" data-deleted="false">Verified</button>
              <button class="filter-btn rounded-full px-4 py-2 text-sm font-bold" data-role="BUSINESS_OWNER" data-kyc="PENDING" data-deleted="false">KYC pending</button>
              <button class="filter-btn rounded-full px-4 py-2 text-sm font-bold" data-role="BUSINESS_OWNER" data-kyc="NOT_SUBMITTED" data-deleted="false">No KYC</button>
              <button class="filter-btn rounded-full px-4 py-2 text-sm font-bold" data-role="" data-kyc="" data-deleted="true">Archived</button>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <div class="flex items-center gap-2">
                <input id="search-input" type="search" placeholder="Search email or name…" class="min-w-0 rounded-xl border border-border bg-background px-4 py-2.5 text-sm font-normal outline-none focus:ring-2 focus:ring-primary" style="flex: 1" />
                <button id="search-btn" class="rounded-xl bg-primary px-4 py-2.5 text-sm font-bold text-primary-foreground hover:opacity-90">Search</button>
              </div>
              <button id="create-btn" class="rounded-xl border border-border px-4 py-2.5 text-sm font-bold hover:border-primary hover:text-primary">+ New user</button>
            </div>
          </div>

          <div id="user-list" class="flex flex-col gap-3"></div>

          <div id="pagination" class="hidden items-center justify-between gap-3"></div>
        </div>

        <div id="user-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4">
          <div class="w-full max-w-md rounded-2xl border border-border bg-card p-6 shadow-xl">
            <div class="flex items-center justify-between">
              <h2 class="font-mono text-xl font-bold" id="modal-title">New user</h2>
              <button id="modal-close" class="rounded-lg p-1 hover:bg-muted" aria-label="Close">&times;</button>
            </div>
            <form id="user-form" class="mt-5 flex flex-col gap-4">
              <input type="hidden" id="f-user-id" />
              <div>
                <label for="f-email" class="mb-1 block text-sm font-semibold">Email</label>
                <input id="f-email" type="email" required class="w-full rounded-xl border border-border bg-background px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-primary" />
              </div>
              <div id="f-password-wrap">
                <label for="f-password" class="mb-1 block text-sm font-semibold">Temporary password</label>
                <input id="f-password" type="password" minlength="8" class="w-full rounded-xl border border-border bg-background px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-primary" />
              </div>
              <div class="grid gap-4 sm:grid-cols-2">
                <div>
                  <label for="f-display-name" class="mb-1 block text-sm font-semibold">Display name</label>
                  <input id="f-display-name" type="text" class="w-full rounded-xl border border-border bg-background px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-primary" />
                </div>
                <div>
                  <label for="f-phone" class="mb-1 block text-sm font-semibold">Phone</label>
                  <input id="f-phone" type="text" class="w-full rounded-xl border border-border bg-background px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-primary" />
                </div>
              </div>
              <div>
                <label for="f-role" class="mb-1 block text-sm font-semibold">Role</label>
                <select id="f-role" class="w-full rounded-xl border border-border bg-background px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-primary">
                  <option value="BUSINESS_OWNER">Business owner</option>
                  <option value="ADMIN">Admin</option>
                </select>
              </div>
              <p class="hidden rounded-xl bg-red-50 p-3 text-sm text-red-600" id="form-message"></p>
              <div class="flex justify-end gap-2">
                <button type="button" id="form-cancel" class="rounded-lg border border-border px-4 py-2 text-sm font-semibold">Cancel</button>
                <button type="submit" id="form-submit" class="rounded-lg bg-primary px-4 py-2 text-sm font-bold text-primary-foreground">Create user</button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/helpers.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/include.js"></script>
  <script>
    if (requireAdmin()) throw new Error('redirecting')

    const msg = document.getElementById('message')
    const userList = document.getElementById('user-list')
    const pagination = document.getElementById('pagination')
    const searchInput = document.getElementById('search-input')
    const searchBtn = document.getElementById('search-btn')
    let currentRole = ''
    let currentKyc = ''
    let currentQ = ''
    let currentDeleted = 'false'
    let currentPage = 1
    const pageLimit = 10

    const KYC_STYLES = {
      NOT_SUBMITTED: 'bg-muted text-muted-foreground',
      PENDING: 'bg-amber-100 text-amber-800',
      VERIFIED: 'bg-primary/15 text-primary',
      REJECTED: 'bg-red-100 text-red-700',
    }
    const ROLE_LABELS = {
      BUSINESS_OWNER: 'Owner',
      ADMIN: 'Admin',
    }

    function showMessage(text) {
      msg.textContent = text
      msg.classList.remove('hidden')
    }

    function setActiveTab() {
      document.querySelectorAll('.filter-btn').forEach(function (btn) {
        const active = btn.getAttribute('data-role') === currentRole && btn.getAttribute('data-kyc') === currentKyc && btn.getAttribute('data-deleted') === currentDeleted
        btn.className = 'filter-btn rounded-full px-4 py-2 text-sm font-bold ' +
          (active ? 'bg-primary text-primary-foreground' : 'bg-muted text-muted-foreground hover:bg-muted/70 hover:text-foreground')
      })
    }

    document.querySelectorAll('.filter-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        currentRole = btn.getAttribute('data-role')
        currentKyc = btn.getAttribute('data-kyc')
        currentDeleted = btn.getAttribute('data-deleted')
        currentQ = ''
        searchInput.value = ''
        currentPage = 1
        loadUsers()
      })
    })

    searchBtn.addEventListener('click', function () {
      currentQ = searchInput.value.trim()
      currentPage = 1
      loadUsers()
    })
    searchInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') searchBtn.click()
    })

    function buildQuery() {
      const params = new URLSearchParams({ page: currentPage, limit: pageLimit, deleted: currentDeleted })
      if (currentRole) params.set('role', currentRole)
      if (currentKyc) params.set('kycStatus', currentKyc)
      if (currentQ) params.set('q', currentQ)
      return params.toString()
    }

    async function loadUsers() {
      setActiveTab()
      userList.innerHTML = '<div class="rounded-2xl border border-dashed border-border py-14 text-center text-muted-foreground">Loading…</div>'
      pagination.classList.add('hidden')
      try {
        const { data } = await apiGet('/admin/users?' + buildQuery())
        renderUsers(data.data || [])
        renderPagination(data.total || 0)
      } catch (err) {
        userList.innerHTML = '<div class="rounded-2xl border border-dashed border-border py-14 text-center text-muted-foreground">Could not load users. ' + escapeHtml(err.message || '') + '</div>'
      }
    }

    function renderUsers(items) {
      userList.innerHTML = ''
      if (!items.length) {
        userList.innerHTML = '<div class="rounded-2xl border border-dashed border-border py-14 text-center text-muted-foreground">No users match that filter.</div>'
        return
      }
      items.forEach(function (u) {
        const div = document.createElement('div')
        div.className = 'rounded-2xl border border-border bg-card p-5'
        const name = u.displayName || '—'
        const kycStyle = KYC_STYLES[u.kycStatus] || 'bg-muted text-muted-foreground'
        const archived = currentDeleted === 'true'
        div.innerHTML = `
          <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
            <div class="min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <h3 class="font-mono text-xl font-bold">${escapeHtml(name)}</h3>
                ${archived ? '<span class="rounded-full bg-red-100 px-2.5 py-1 text-xs font-bold text-red-700">Archived</span>' : ''}
                <span class="rounded-full px-2.5 py-1 text-xs font-bold ${kycStyle}">${escapeHtml(u.kycStatus.replace('_', ' '))}</span>
                <span class="rounded-full bg-muted px-2.5 py-1 text-xs font-bold text-muted-foreground">${ROLE_LABELS[u.role] || escapeHtml(u.role)}</span>
              </div>
              <p class="mt-1 text-sm text-muted-foreground">${escapeHtml(u.email)} · joined ${new Date(u.createdAt).toLocaleDateString()} · ${u.businessCount} business${u.businessCount === 1 ? '' : 'es'}</p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button class="view-btn rounded-lg border border-border px-3 py-2 text-xs font-bold hover:border-primary">View</button>
              ${!archived ? '<button class="edit-btn rounded-lg border border-border px-3 py-2 text-xs font-bold hover:border-primary">Edit</button>' : ''}
              ${!archived ? '<button class="archive-btn rounded-lg border border-border px-3 py-2 text-xs font-bold text-red-600 hover:border-red-600">Archive</button>' : '<button class="restore-btn rounded-lg bg-primary px-3 py-2 text-xs font-bold text-primary-foreground">Restore</button>'}
            </div>
          </div>`
        div.querySelector('.view-btn').addEventListener('click', function () {
          openDetail(u.id)
        })
        if (!archived) {
          div.querySelector('.edit-btn').addEventListener('click', function () {
            openEdit(u)
          })
          div.querySelector('.archive-btn').addEventListener('click', function () {
            archiveUser(u)
          })
        } else {
          div.querySelector('.restore-btn').addEventListener('click', function () {
            restoreUser(u)
          })
        }
        userList.appendChild(div)
      })
    }

    function renderPagination(total) {
      const pages = Math.max(1, Math.ceil(total / pageLimit))
      pagination.classList.remove('hidden')
      pagination.innerHTML = '<span class="text-sm text-muted-foreground">' + total + ' user' + (total === 1 ? '' : 's') + '</span>' +
        '<div class="flex items-center gap-2">' +
        '<button id="prev-page" class="rounded-lg border border-border px-3 py-2 text-sm font-semibold" ' + (currentPage <= 1 ? 'disabled' : '') + '>Prev</button>' +
        '<span class="text-sm text-muted-foreground">Page ' + currentPage + ' of ' + pages + '</span>' +
        '<button id="next-page" class="rounded-lg border border-border px-3 py-2 text-sm font-semibold" ' + (currentPage >= pages ? 'disabled' : '') + '>Next</button>' +
        '</div>'
      document.getElementById('prev-page').addEventListener('click', function () {
        if (currentPage <= 1) return
        currentPage -= 1
        loadUsers()
      })
      document.getElementById('next-page').addEventListener('click', function () {
        if (currentPage >= pages) return
        currentPage += 1
        loadUsers()
      })
    }

    function closeDetail() {
      loadUsers()
    }

    async function openDetail(userId) {
      userList.innerHTML = '<div class="rounded-2xl border border-dashed border-border py-14 text-center text-muted-foreground">Loading user…</div>'
      pagination.classList.add('hidden')
      try {
        const { data } = await apiGet('/admin/users/' + userId)
        renderDetail(data.user)
      } catch (err) {
        userList.innerHTML = '<div class="rounded-2xl border border-dashed border-border py-14 text-center text-muted-foreground">Could not load this user. ' + escapeHtml(err.message || '') + '</div>'
      }
    }

    function renderDetail(u) {
      const kycStyle = KYC_STYLES[u.kycStatus] || 'bg-muted text-muted-foreground'
      const bizRows = (u.businesses || []).map(function (b) {
        const style = { PENDING: 'bg-amber-100 text-amber-800', APPROVED: 'bg-primary/15 text-primary', REJECTED: 'bg-red-100 text-red-700', SUSPENDED: 'bg-muted text-muted-foreground' }[b.status] || 'bg-muted text-muted-foreground'
        return '<div class="flex items-center justify-between gap-4 rounded-xl border border-border px-4 py-3 text-sm"><span class="font-semibold">' + escapeHtml(b.name) + '</span><span class="rounded-full px-2.5 py-1 text-xs font-bold ' + style + '">' + escapeHtml(b.status) + '</span></div>'
      }).join('')

      let html = '<div class="rounded-2xl border border-border bg-card p-6">'
      html += '<div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-start">'
      html += '<div><div class="flex items-center gap-2 flex-wrap"><h2 class="font-mono text-xl font-bold">' + escapeHtml(u.displayName || '—') + '</h2><span class="rounded-full px-2.5 py-1 text-xs font-bold ' + kycStyle + '">' + escapeHtml(u.kycStatus.replace('_', ' ')) + '</span>' + (u.deletedAt ? '<span class="rounded-full bg-red-100 px-2.5 py-1 text-xs font-bold text-red-700">Archived</span>' : '') + '</div>'
      html += '<p class="mt-1 text-sm text-muted-foreground">' + escapeHtml(u.email) + '</p></div>'
      html += '<div class="flex flex-col items-end gap-2"><button id="back-btn" class="rounded-lg border border-border px-4 py-2 text-sm font-semibold">&larr; Back to list</button>' + (u.deletedAt ? '<button id="d-restore" class="rounded-lg bg-primary px-4 py-2 text-sm font-bold text-primary-foreground">Restore</button>' : '<button id="d-archive" class="rounded-lg border border-border px-4 py-2 text-sm font-bold text-red-600 hover:border-red-600">Archive</button>') + '</div>'
      html += '</div>'
      html += '<dl class="mt-5 grid gap-x-8 gap-y-3 text-sm sm:grid-cols-2">'
      html += '<div class="flex justify-between gap-4 border-b border-border pb-2"><dt class="text-muted-foreground">Role</dt><dd class="font-semibold">' + (ROLE_LABELS[u.role] || escapeHtml(u.role)) + '</dd></div>'
      html += '<div class="flex justify-between gap-4 border-b border-border pb-2"><dt class="text-muted-foreground">Phone</dt><dd class="font-semibold">' + escapeHtml(u.phone || '—') + '</dd></div>'
      html += '<div class="flex justify-between gap-4 border-b border-border pb-2"><dt class="text-muted-foreground">KYC status</dt><dd class="font-semibold">' + escapeHtml(u.kycStatus.replace('_', ' ')) + '</dd></div>'
      html += '<div class="flex justify-between gap-4 border-b border-border pb-2"><dt class="text-muted-foreground">Businesses</dt><dd class="font-semibold">' + u.businessCount + '</dd></div>'
      html += '<div class="flex justify-between gap-4 border-b border-border pb-2"><dt class="text-muted-foreground">Joined</dt><dd class="font-semibold">' + new Date(u.createdAt).toLocaleString() + '</dd></div>'
      if (u.deletedAt) {
        html += '<div class="flex justify-between gap-4 border-b border-border pb-2"><dt class="text-muted-foreground">Archived</dt><dd class="font-semibold text-red-600">' + new Date(u.deletedAt).toLocaleString() + '</dd></div>'
      }
      html += '</dl>'
      if (u.role === 'BUSINESS_OWNER') {
        html += '<div class="mt-6">'
        html += '<h3 class="font-mono text-lg font-bold">Businesses</h3>'
        html += '<div class="mt-3 flex flex-col gap-2">' + (bizRows || '<p class="text-sm text-muted-foreground">This owner has no businesses yet.</p>') + '</div>'
        html += '</div>'
      }
      if (u.role === 'BUSINESS_OWNER') {
        html += '<div class="mt-6">'
        html += '<a class="inline-block rounded-xl bg-primary px-4 py-2 text-sm font-bold text-primary-foreground" href="kyc-review.html">Review ' + escapeHtml((u.kycStatus || 'KYC').toLowerCase()) + ' documents →</a>'
        html += '</div>'
      }
      html += '</div>'
      userList.innerHTML = html
      document.getElementById('back-btn').addEventListener('click', closeDetail)
      const restoreBtn = document.getElementById('d-restore')
      const archiveBtn = document.getElementById('d-archive')
      if (restoreBtn) restoreBtn.addEventListener('click', function () { restoreUser(u) })
      if (archiveBtn) archiveBtn.addEventListener('click', function () { archiveUser(u) })
    }

    const modal = document.getElementById('user-modal')
    const form = document.getElementById('user-form')
    const formMessage = document.getElementById('form-message')
    const modalTitle = document.getElementById('modal-title')
    const passwordWrap = document.getElementById('f-password-wrap')
    const submitBtn = document.getElementById('form-submit')
    const emailInput = document.getElementById('f-email')
    let editingUser = null

    function showModal(title, editMode) {
      editingUser = editMode
      modalTitle.textContent = title
      formMessage.classList.add('hidden')
      passwordWrap.classList.toggle('hidden', !!editMode)
      submitBtn.textContent = editMode ? 'Save changes' : 'Create user'
      emailInput.disabled = !!editMode
      modal.classList.remove('hidden')
      modal.classList.add('flex')
    }

    function hideModal() {
      modal.classList.add('hidden')
      modal.classList.remove('flex')
      emailInput.disabled = false
      editingUser = null
    }

    document.getElementById('create-btn').addEventListener('click', function () {
      form.reset()
      document.getElementById('f-user-id').value = ''
      document.getElementById('f-role').value = 'BUSINESS_OWNER'
      showModal('New user', null)
    })
    document.getElementById('modal-close').addEventListener('click', hideModal)
    document.getElementById('form-cancel').addEventListener('click', hideModal)
    modal.addEventListener('click', function (e) {
      if (e.target === modal) hideModal()
    })

    function openEdit(u) {
      document.getElementById('f-user-id').value = u.id
      emailInput.value = u.email
      document.getElementById('f-display-name').value = u.displayName || ''
      document.getElementById('f-phone').value = u.phone || ''
      document.getElementById('f-role').value = u.role
      showModal('Edit user', u)
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault()
      formMessage.classList.add('hidden')
      const id = document.getElementById('f-user-id').value
      const role = document.getElementById('f-role').value
      try {
        if (id) {
          const body = {
            displayName: document.getElementById('f-display-name').value.trim() || null,
            phone: document.getElementById('f-phone').value.trim() || null,
            role,
          }
          await apiPatch('/admin/users/' + id, body)
          showMessage('User updated.')
        } else {
          const body = {
            email: emailInput.value.trim(),
            password: document.getElementById('f-password').value,
            role,
            displayName: document.getElementById('f-display-name').value.trim() || undefined,
            phone: document.getElementById('f-phone').value.trim() || undefined,
          }
          await apiPost('/admin/users', body)
          showMessage('User created. Share the temporary password securely.')
        }
        hideModal()
        loadUsers()
      } catch (err) {
        formMessage.textContent = err.message || 'Save failed'
        formMessage.classList.remove('hidden')
      }
    })

    async function archiveUser(u) {
      if (!confirm('Archive ' + u.email + '? They will be locked out and hidden from the directory. This can be undone with Restore.')) return
      try {
        await apiDelete('/admin/users/' + u.id)
        showMessage('User archived.')
        loadUsers()
      } catch (err) {
        showMessage(err.message || 'Archive failed')
      }
    }

    async function restoreUser(u) {
      if (!confirm('Restore ' + u.email + '? They will regain access and reappear in the directory.')) return
      try {
        await apiPost('/admin/users/' + u.id + '/restore')
        showMessage('User restored.')
        loadUsers()
      } catch (err) {
        showMessage(err.message || 'Restore failed')
      }
    }

    loadUsers()
  </script>
</body>
</html>
