<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Nookly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="settings" class="min-h-screen bg-background text-foreground antialiased">
  <div data-include="partials/icons.html"></div>
  <main class="min-h-screen bg-background text-foreground">
    <div data-include="partials/header-account.html"></div>
    <div class="mx-auto grid max-w-6xl gap-8 px-5 py-8 lg:grid-cols-[220px_1fr] lg:px-8 lg:py-12">
      <div data-include="partials/sidebar-account.html"></div>
      <section>
        <div class="mb-8">
          <p class="mb-2 text-xs font-bold uppercase tracking-[0.18em] text-primary">Your Nookly</p>
          <h1 class="font-mono text-4xl font-bold tracking-[-0.06em]">Settings</h1>
          <p class="mt-3 max-w-2xl leading-relaxed text-muted-foreground">Control your communication choices and account security.</p>
        </div>
        <p class="mb-6 hidden rounded-xl bg-red-50 p-3 text-sm text-red-600" id="message"></p>

        <div class="flex flex-col gap-6">
          <div class="rounded-2xl border border-border bg-card p-6">
            <div class="flex items-center gap-3"><svg class="size-5 text-primary" aria-hidden="true"><use href="#i-lock-keyhole"/></svg><h2 class="font-mono text-xl font-bold">Change password</h2></div>
            <p class="mt-2 text-sm text-muted-foreground">Use a strong, unique password that you do not reuse elsewhere.</p>
            <form id="password-form" class="mt-6 flex flex-col gap-5">
              <label class="flex flex-col gap-2 text-sm font-semibold">Current password<input required type="password" name="currentPassword" autocomplete="current-password" class="rounded-xl border border-input bg-background px-4 py-3 font-normal outline-none focus:ring-2 focus:ring-primary/40" /></label>
              <label class="flex flex-col gap-2 text-sm font-semibold">New password<input required minlength="8" type="password" name="newPassword" autocomplete="new-password" class="rounded-xl border border-input bg-background px-4 py-3 font-normal outline-none focus:ring-2 focus:ring-primary/40" /></label>
              <label class="flex flex-col gap-2 text-sm font-semibold">Confirm new password<input required minlength="8" type="password" name="confirmPassword" autocomplete="new-password" class="rounded-xl border border-input bg-background px-4 py-3 font-normal outline-none focus:ring-2 focus:ring-primary/40" /></label>
              <button id="save-btn" class="rounded-xl bg-primary px-5 py-3 font-bold text-primary-foreground hover:opacity-90">Update password</button>
            </form>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
<script src="js/include.js"></script>
  <script>
    if (requireOwner()) throw new Error('redirecting')

    const form = document.getElementById('password-form')
    const msg = document.getElementById('message')
    const btn = document.getElementById('save-btn')

    function showMessage(text, isError) {
      msg.textContent = text
      msg.className = 'mb-6 rounded-xl p-3 text-sm ' + (isError ? 'bg-red-50 text-red-600' : 'bg-primary/10 text-primary')
      msg.classList.remove('hidden')
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault()
      msg.classList.add('hidden')
      if (form.newPassword.value !== form.confirmPassword.value) {
        showMessage('New password and confirmation do not match.', true)
        return
      }
      btn.disabled = true
      btn.textContent = 'Updating…'
      try {
        await apiPatch('/account/password', {
          currentPassword: form.currentPassword.value,
          newPassword: form.newPassword.value,
        })
        showMessage('Password updated. Use your new password next time you log in.', false)
        form.reset()
      } catch (err) {
        showMessage(err.fields && err.fields.currentPassword ? err.fields.currentPassword : err.message || 'Could not update password.', true)
      } finally {
        btn.disabled = false
        btn.textContent = 'Update password'
      }
    })
  </script>
</body>
</html>
