<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset your password — Nookly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen bg-background text-foreground antialiased">
  <div data-include="partials/icons.html"></div>
  <main class="flex min-h-screen items-center justify-center bg-background px-5 py-12">
    <div class="w-full max-w-md">
      <a href="index.html" class="mb-10 flex items-center justify-center gap-2.5">
        <span class="flex size-9 items-center justify-center rounded-xl bg-primary text-primary-foreground"><svg class="size-5" aria-hidden="true"><use href="#i-sparkles"/></svg></span>
        <span class="font-mono text-xl font-bold">nookly</span>
      </a>
      <div class="rounded-3xl border border-border bg-card p-6 shadow-sm sm:p-9">
        <h1 class="font-mono text-3xl font-bold">Reset your password</h1>
        <p class="mt-2 text-muted-foreground">Enter your email and we&apos;ll send a reset link.</p>
        <p class="mt-5 hidden rounded-xl bg-red-50 p-3 text-sm text-red-600" id="message"></p>
        <form class="mt-7 flex flex-col gap-5" id="reset-form">
          <label class="flex flex-col gap-2 text-sm font-semibold">Email<input required type="email" name="email" class="rounded-xl border border-input bg-background px-4 py-3 font-normal outline-none focus:ring-2 focus:ring-primary/40" /></label>
          <button id="submit-btn" class="rounded-xl bg-primary px-5 py-3 font-bold text-primary-foreground hover:opacity-90">Send reset link</button>
        </form>
        <p class="mt-7 text-center text-sm text-muted-foreground"><a href="login.html" class="font-bold text-primary">Back to login</a></p>
      </div>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/include.js"></script>
  <script>
    const form = document.getElementById('reset-form')
    const msg = document.getElementById('message')
    const btn = document.getElementById('submit-btn')

    function showMessage(text, isError) {
      msg.textContent = text
      msg.className = 'mt-5 rounded-xl p-3 text-sm ' + (isError ? 'bg-red-50 text-red-600' : 'bg-primary/10 text-primary')
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault()
      msg.classList.add('hidden')
      btn.disabled = true
      btn.textContent = 'Sending…'
      try {
        await apiPost('/auth/forgot-password', { email: form.email.value.trim() })
        showMessage('If an account exists for this email, a reset link has been sent. Check your inbox.', false)
        form.email.value = ''
      } catch (err) {
        showMessage(err.fields && err.fields.email ? err.fields.email : err.message || 'Request failed. Please try again.', true)
      } finally {
        btn.disabled = false
        btn.textContent = 'Send reset link'
      }
    })
  </script>
</body>
</html>
