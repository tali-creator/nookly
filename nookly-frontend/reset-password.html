<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose a new password — Nookly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen bg-background text-foreground antialiased">
  <div data-include="partials/icons.html"></div>
  <main class="flex min-h-screen items-center justify-center bg-background px-5 py-12">
    <div class="w-full max-w-md">
      <a href="index.html" class="mb-10 flex items-center justify-center gap-2.5">
        <span class="flex size-9 items-center justify-center rounded-xl bg-primary text-primary-foreground"><svg class="size-5" aria-hidden="true"><use href="#i-sparkles"/></svg></span>
        <span class="font-mono text-xl font-bold">nookly</span>
      </a>
      <div class="rounded-3xl border border-border bg-card p-6 shadow-sm sm:p-9">
        <h1 class="font-mono text-3xl font-bold">Choose a new password</h1>
        <p class="mt-2 text-muted-foreground">Set a new password for your account.</p>
        <p class="mt-5 hidden rounded-xl bg-red-50 p-3 text-sm text-red-600" id="message"></p>
        <form class="mt-7 flex flex-col gap-5" id="reset-form">
          <label class="flex flex-col gap-2 text-sm font-semibold">New password<input required minlength="8" type="password" name="newPassword" autocomplete="new-password" class="rounded-xl border border-input bg-background px-4 py-3 font-normal outline-none focus:ring-2 focus:ring-primary/40" /></label>
          <label class="flex flex-col gap-2 text-sm font-semibold">Confirm new password<input required minlength="8" type="password" name="confirmPassword" autocomplete="new-password" class="rounded-xl border border-input bg-background px-4 py-3 font-normal outline-none focus:ring-2 focus:ring-primary/40" /></label>
          <button id="submit-btn" class="rounded-xl bg-primary px-5 py-3 font-bold text-primary-foreground hover:opacity-90">Update password</button>
        </form>
        <p class="mt-7 text-center text-sm text-muted-foreground"><a href="login.html" class="font-bold text-primary">Back to login</a></p>
      </div>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/include.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token')
    const form = document.getElementById('reset-form')
    const msg = document.getElementById('message')
    const btn = document.getElementById('submit-btn')

    function showMessage(text, isError) {
      msg.textContent = text
      msg.className = 'mt-5 rounded-xl p-3 text-sm ' + (isError ? 'bg-red-50 text-red-600' : 'bg-primary/10 text-primary')
    }

    if (!token) {
      showMessage('This reset link is invalid or has expired, please request a new one.', true)
      form.style.display = 'none'
    } else {
      form.addEventListener('submit', async function (e) {
        e.preventDefault()
        msg.classList.add('hidden')
        if (form.newPassword.value !== form.confirmPassword.value) {
          showMessage('New password and confirmation do not match.', true)
          return
        }
        btn.disabled = true
        btn.textContent = 'Updating…'
        try {
          await apiPost('/auth/reset-password', { token, newPassword: form.newPassword.value })
          showMessage('Password updated. You can now log in with your new password.', false)
          form.style.display = 'none'
          const link = document.createElement('p')
          link.className = 'mt-4 text-center text-sm'
          link.innerHTML = '<a href="login.html" class="font-bold text-primary">Go to login</a>'
          msg.parentNode.appendChild(link)
        } catch (err) {
          showMessage(err.fields && err.fields.newPassword ? err.fields.newPassword : err.message || 'Could not reset your password.', true)
          btn.disabled = false
          btn.textContent = 'Update password'
        }
      })
    }
  </script>
</body>
</html>
