<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Nookly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen bg-background text-foreground antialiased">
  <div data-include="partials/icons.html"></div>
  <main class="flex min-h-screen items-center justify-center bg-background px-5 py-12">
    <div class="w-full max-w-md">
      <a href="index.html" class="mb-10 flex items-center justify-center gap-2.5">
        <span class="flex size-9 items-center justify-center rounded-xl bg-primary text-primary-foreground"><svg class="size-5" aria-hidden="true"><use href="#i-sparkles"/></svg></span>
        <span class="font-mono text-xl font-bold">nookly</span>
      </a>
      <div class="rounded-3xl border border-border bg-card p-6 shadow-sm sm:p-9">
        <h1 class="font-mono text-3xl font-bold">Welcome back</h1>
        <p class="mt-2 text-muted-foreground">Log in to manage your bookings and profile.</p>
        <p class="mt-5 hidden rounded-xl bg-red-50 p-3 text-sm text-red-600" id="message"></p>
        <form class="mt-7 flex flex-col gap-5" id="login-form">
          <label class="flex flex-col gap-2 text-sm font-semibold">Email<input required type="email" name="email" class="rounded-xl border border-input bg-background px-4 py-3 font-normal outline-none focus:ring-2 focus:ring-primary/40" /></label>
          <label class="flex flex-col gap-2 text-sm font-semibold">Password<input required type="password" name="password" class="rounded-xl border border-input bg-background px-4 py-3 font-normal outline-none focus:ring-2 focus:ring-primary/40" /></label>
          <div class="flex justify-end"><a href="forgot-password.html" class="text-sm font-semibold text-primary hover:underline">Forgot password?</a></div>
          <button id="submit-btn" class="rounded-xl bg-primary px-5 py-3 font-bold text-primary-foreground hover:opacity-90">Log in</button>
        </form>
        <p class="mt-7 text-center text-sm text-muted-foreground">New to Nookly? <a href="signup.html" class="font-bold text-primary">Create an account</a></p>
      </div>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/include.js"></script>
  <script>
    const form = document.getElementById('login-form')
    const msg = document.getElementById('message')
    const btn = document.getElementById('submit-btn')

    function showMessage(text, isError) {
      msg.textContent = text
      msg.className = 'mt-5 rounded-xl p-3 text-sm ' + (isError ? 'bg-red-50 text-red-600' : 'bg-primary/10 text-primary')
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault()
      msg.classList.add('hidden')
      btn.disabled = true
      btn.textContent = 'Logging in…'
      try {
        const { data } = await apiPost('/auth/login', {
          email: form.email.value.trim(),
          password: form.password.value,
        })
        saveSession(data.user, data.token)
        if (data.user.role === 'ADMIN') window.location.href = '/admin/dashboard.html'
        else window.location.href = '/owner/dashboard.html'
      } catch (err) {
        showMessage(err.message || 'Login failed. Please try again.', true)
        btn.disabled = false
        btn.textContent = 'Log in'
      }
    })
  </script>
</body>
</html>
