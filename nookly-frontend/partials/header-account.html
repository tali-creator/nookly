<!-- Account shell header (max-w-6xl, back link + bell + avatar) -->
<header class="border-b border-border/70 bg-background/90 backdrop-blur">
  <div class="mx-auto flex h-20 max-w-6xl items-center justify-between px-5 lg:px-8">
    <a href="/index.html" class="flex items-center gap-2.5" aria-label="Nookly home">
      <span class="flex size-9 items-center justify-center rounded-xl bg-primary text-primary-foreground"><svg class="size-5" aria-hidden="true"><use href="#i-sparkles"/></svg></span>
      <span class="font-mono text-xl font-bold">nookly</span>
    </a>
    <div class="flex items-center gap-3">
      <a href="/index.html" class="hidden items-center gap-2 text-sm text-muted-foreground hover:text-foreground sm:flex"><svg class="size-4" aria-hidden="true"><use href="#i-chevron-left"/></svg>Back to browse</a>
      <div class="relative" data-notif-root>
        <button class="rounded-full p-2.5 text-muted-foreground hover:bg-muted" data-notif-bell aria-label="Notifications"><svg class="size-5" aria-hidden="true"><use href="#i-bell"/></svg></button>
      </div>
      <div class="flex size-9 items-center justify-center rounded-full bg-primary/20 text-xs font-bold text-primary" id="shell-avatar">G</div>
    </div>
  </div>
</header>
