<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create your owner account — Nookly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="min-h-screen bg-background text-foreground antialiased">
  <div data-include="../partials/icons.html"></div>
  <main class="flex min-h-screen items-center justify-center bg-background px-5 py-10">
    <div class="w-full max-w-md">
      <a href="../index.html" class="mb-10 flex items-center justify-center gap-2 font-mono text-xl font-bold">
        <span class="flex size-9 items-center justify-center rounded-xl bg-primary text-primary-foreground"><svg class="size-5" aria-hidden="true"><use href="#i-sparkles"/></svg></span>nookly
      </a>
      <div class="rounded-3xl border border-border bg-card p-7 shadow-sm">
        <p class="text-xs font-bold uppercase tracking-[.18em] text-primary">owner portal</p>
        <h1 class="mt-3 font-mono text-3xl font-bold">Create your owner account</h1>
        <p class="mt-3 text-sm leading-relaxed text-muted-foreground">List your services and reach more local customers.</p>
        <p class="mt-5 hidden rounded-xl bg-red-50 p-3 text-sm text-red-600" id="message"></p>
        <div class="mt-7 flex flex-col gap-4" id="role-form">
          <input id="email" placeholder="Email address" type="email" class="rounded-xl border border-border bg-background px-4 py-3 outline-none focus:ring-2 focus:ring-primary" />
          <input id="password" placeholder="Password (8+ characters)" type="password" class="rounded-xl border border-border bg-background px-4 py-3 outline-none focus:ring-2 focus:ring-primary" />
          <input id="confirmPassword" placeholder="Confirm password" type="password" class="rounded-xl border border-border bg-background px-4 py-3 outline-none focus:ring-2 focus:ring-primary" />
          <label class="flex flex-col gap-1 text-xs font-semibold text-muted-foreground">Date of birth<input id="dateOfBirth" type="date" max="2010-01-01" class="rounded-xl border border-border bg-background px-4 py-3 font-normal text-foreground outline-none focus:ring-2 focus:ring-primary" /></label>
          <button id="continue-btn" class="flex items-center justify-center gap-2 rounded-xl bg-primary py-3 font-bold text-primary-foreground">Continue <svg class="size-4" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
        </div>
        <p class="mt-6 text-center text-sm text-muted-foreground">Already an owner? <a href="login.html" class="font-bold text-primary">Log in</a></p>
      </div>
    </div>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/include.js"></script>
  <script>
    const btn = document.getElementById('continue-btn')
    const msg = document.getElementById('message')

    function showMessage(text) {
      msg.textContent = text
      msg.classList.remove('hidden')
    }

    btn.addEventListener('click', async function () {
      msg.classList.add('hidden')
      btn.disabled = true
      btn.textContent = 'Creating account…'
      try {
        const { data } = await apiPost('/auth/signup', {
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
          confirmPassword: document.getElementById('confirmPassword').value,
          dateOfBirth: document.getElementById('dateOfBirth').value || undefined,
          role: 'BUSINESS_OWNER',
        })
        saveSession(data.user, data.token)
        window.location.href = 'dashboard.html'
      } catch (err) {
        if (err.fields && err.fields.email) showMessage(err.fields.email)
        else if (err.fields && err.fields.password) showMessage(err.fields.password)
        else if (err.fields && err.fields.confirmPassword) showMessage(err.fields.confirmPassword)
        else if (err.fields && err.fields.dateOfBirth) showMessage(err.fields.dateOfBirth)
        else showMessage(err.message || 'Signup failed. Please try again.')
        btn.disabled = false
        btn.textContent = 'Continue'
      }
    })
  </script>
</body>
</html>
