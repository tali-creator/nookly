<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner dashboard — Nookly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body data-page="owner" class="min-h-screen bg-background text-foreground antialiased">
  <div data-include="../partials/icons.html"></div>
  <main class="min-h-screen bg-background text-foreground">
    <div data-include="../partials/header-marketplace.html"></div>
    <div class="mx-auto grid max-w-7xl gap-8 px-5 py-8 lg:grid-cols-[220px_1fr] lg:px-8 lg:py-12">
      <div data-include="../partials/sidebar-marketplace.html"></div>
      <section>
        <div class="mb-8">
          <p class="mb-2 text-xs font-bold uppercase tracking-[0.18em] text-primary">Your Nookly</p>
          <h1 class="font-mono text-4xl font-bold tracking-[-0.06em]">Owner dashboard</h1>
          <p class="mt-3 max-w-2xl leading-relaxed text-muted-foreground">Manage your businesses, keep listings fresh, and see how customers are finding you.</p>
        </div>
        <div class="flex flex-col gap-6">
          <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
            <div class="rounded-2xl bg-primary p-5 text-primary-foreground"><svg class="size-5" aria-hidden="true"><use href="#i-store"/></svg><p class="mt-8 text-3xl font-bold" id="business-count">0</p><p class="text-sm opacity-80">Active businesses</p></div>
            <div class="rounded-2xl border border-border bg-card p-5"><svg class="size-5 text-primary" aria-hidden="true"><use href="#i-clock-3"/></svg><p class="mt-8 text-3xl font-bold" id="pending-count">0</p><p class="text-sm text-muted-foreground">Pending review</p></div>
            <div class="rounded-2xl border border-border bg-card p-5"><svg class="size-5 text-primary" aria-hidden="true"><use href="#i-circle-check"/></svg><p class="mt-8 text-3xl font-bold" id="approved-count">0</p><p class="text-sm text-muted-foreground">Approved &amp; live</p></div>
            <div class="rounded-2xl border border-border bg-card p-5"><svg class="size-5 text-primary" aria-hidden="true"><use href="#i-eye"/></svg><p class="mt-8 text-3xl font-bold" id="visitors-count">–</p><p class="text-sm text-muted-foreground">Profile visitors</p></div>
          </div>
          <div class="flex items-center justify-between">
            <h2 class="font-mono text-2xl font-bold">Your businesses</h2>
            <a href="business-form.html" class="flex items-center gap-2 rounded-full bg-primary px-4 py-2.5 text-sm font-bold text-primary-foreground"><svg class="size-4" aria-hidden="true"><use href="#i-plus"/></svg>Add business</a>
          </div>
          <div class="grid gap-4" id="business-list"></div>
          <a href="kyc.html" class="rounded-2xl border border-primary/20 bg-primary/10 p-5 text-sm font-semibold">Manage owner KYC verification <svg class="inline size-4" aria-hidden="true"><use href="#i-chevron-right"/></svg></a>
        </div>
      </section>
    </div>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/helpers.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/include.js"></script>
  <script>
    if (requireOwner()) throw new Error('redirecting')

    const STATUS_STYLES = {
      PENDING: 'bg-amber-100 text-amber-800',
      APPROVED: 'bg-primary/15 text-primary',
      REJECTED: 'bg-red-100 text-red-700',
      SUSPENDED: 'bg-muted text-muted-foreground',
    }

    function statusBadge(status, note) {
      let html = '<span class="rounded-full px-2.5 py-1 text-xs font-bold ' + (STATUS_STYLES[status] || 'bg-muted text-muted-foreground') + '">' + status + '</span>'
      if (status === 'REJECTED' && note) {
        html += '<p class="mt-2 text-xs text-muted-foreground"><strong class="text-red-600">Reason:</strong> ' + escapeHtml(note) + '</p>'
      }
      return html
    }

    async function load() {
      const list = document.getElementById('business-list')
      list.innerHTML = '<div class="rounded-2xl border border-dashed border-border py-14 text-center text-muted-foreground">Loading your businesses…</div>'
      try {
        const { data } = await apiGet('/businesses/mine')
        const items = data.businesses || []
        document.getElementById('business-count').textContent = items.length
        document.getElementById('pending-count').textContent = items.filter((b) => b.status === 'PENDING').length
        document.getElementById('approved-count').textContent = items.filter((b) => b.status === 'APPROVED').length

        apiGet('/owners/me/visits').then((res) => {
          document.getElementById('visitors-count').textContent = (res.data.visitors || 0).toLocaleString()
        }).catch(() => {})

        list.innerHTML = ''
        if (!items.length) {
          list.innerHTML = '<div class="rounded-2xl border border-dashed border-border py-14 text-center text-muted-foreground">You have no businesses yet. Add your first one to get started.</div>'
          return
        }
        items.forEach((b) => {
          const div = document.createElement('div')
          div.className = 'rounded-2xl border border-border bg-card p-5'
          const categoryName = b.category ? b.category.name : ''
          div.innerHTML = `
            <div class="flex flex-col justify-between gap-5 sm:flex-row sm:items-start">
              <div>
                <div class="flex items-center gap-2 flex-wrap"><h3 class="font-mono text-xl font-bold">${escapeHtml(b.name)}</h3>${statusBadge(b.status, b.moderationNote)}</div>
                <p class="mt-1 text-sm text-muted-foreground">${escapeHtml(categoryName)}${b.address ? ' · ' + escapeHtml(b.address) : ''}</p>
              </div>
              <div class="flex gap-2 flex-wrap">
                <a href="business-form.html?id=${b.id}" class="rounded-xl border border-border px-4 py-2 text-sm font-semibold">Edit listing</a>
                <a href="analytics.html?id=${b.id}" class="flex items-center gap-1 rounded-xl bg-muted px-4 py-2 text-sm font-semibold">Analytics <svg class="size-4" aria-hidden="true"><use href="#i-chevron-right"/></svg></a>
                <button class="delete-btn rounded-xl border border-destructive/30 px-4 py-2 text-sm font-semibold text-destructive">Delete</button>
              </div>
            </div>`
          div.querySelector('.delete-btn').addEventListener('click', async () => {
            if (!confirm('Delete "' + b.name + '"? This cannot be undone.')) return
            try {
              await apiDelete('/businesses/' + b.id)
              load()
            } catch (err) {
              alert(err.message || 'Delete failed')
            }
          })
          list.appendChild(div)
        })
      } catch (err) {
        list.innerHTML = '<div class="rounded-2xl border border-dashed border-border py-14 text-center text-muted-foreground">Could not load your businesses. ' + escapeHtml(err.message || '') + '</div>'
      }
    }

    load()
  </script>
</body>
</html>
