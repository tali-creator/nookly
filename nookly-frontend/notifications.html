<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications — Nookly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="notifications" class="min-h-screen bg-background text-foreground antialiased">
  <div data-include="partials/icons.html"></div>
  <main class="min-h-screen bg-background text-foreground">
    <div data-include="partials/header-account.html"></div>
    <div class="mx-auto grid max-w-6xl gap-8 px-5 py-8 lg:grid-cols-[220px_1fr] lg:px-8 lg:py-12">
      <div data-include="partials/sidebar-account.html"></div>
      <section>
        <div class="mb-8 flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
          <div>
            <p class="mb-2 text-xs font-bold uppercase tracking-[0.18em] text-primary">Inbox</p>
            <h1 class="font-mono text-4xl font-bold tracking-[-0.06em]">Notifications</h1>
            <p class="mt-3 text-sm text-muted-foreground">Updates about your businesses, verification, and customer messages.</p>
          </div>
          <button id="mark-all-btn" class="self-start rounded-full border border-border px-5 py-2.5 text-sm font-semibold transition hover:bg-muted sm:self-auto">
            <span class="hidden items-center gap-2" id="mark-all-label"><svg class="size-4" aria-hidden="true"><use href="#i-circle-check"/></svg>Mark all read</span>
          </button>
        </div>
        <div id="notif-loading" class="rounded-2xl border border-dashed border-border py-16 text-center text-muted-foreground">Loading notifications…</div>
        <div id="notif-list" class="hidden divide-y divide-border overflow-hidden rounded-2xl border border-border bg-card"></div>
        <div id="notif-empty" class="hidden rounded-2xl border border-dashed border-border py-16 text-center">
          <svg class="mx-auto size-8 text-muted-foreground" aria-hidden="true"><use href="#i-bell"/></svg>
          <h2 class="mt-4 font-mono text-xl font-bold">You're all caught up</h2>
          <p class="mt-2 text-sm text-muted-foreground">New notifications will show up here.</p>
        </div>
        <div id="load-more" class="mt-6 hidden text-center">
          <button id="load-more-btn" class="rounded-full border border-border px-5 py-2.5 text-sm font-semibold transition hover:bg-muted">Load more</button>
        </div>
      </section>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/include.js"></script>
  <script>
    if (requireOwner()) throw new Error('redirecting')

    const list = document.getElementById('notif-list')
    const empty = document.getElementById('notif-empty')
    const loading = document.getElementById('notif-loading')
    const loadMore = document.getElementById('load-more')
    const markAllBtn = document.getElementById('mark-all-btn')

    let page = 1
    let hasMore = false
    let notifications = []

    function timeAgo(iso) {
      const diff = Date.now() - new Date(iso).getTime()
      const min = Math.floor(diff / 60000)
      if (min < 1) return 'Just now'
      if (min < 60) return min + 'm ago'
      const hr = Math.floor(min / 60)
      if (hr < 24) return hr + 'h ago'
      const day = Math.floor(hr / 24)
      if (day < 7) return day + 'd ago'
      return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })
    }

    function icon(type) {
      const icons = {
        BUSINESS_APPROVED: '#i-circle-check',
        BUSINESS_REJECTED: '#i-x-circle',
        BUSINESS_SUSPENDED: '#i-alert-triangle',
        KYC_VERIFIED: '#i-shield-check',
        KYC_REJECTED: '#i-shield-x',
        NEW_MESSAGE: '#i-message-circle',
      }
      return '<svg class="size-4" aria-hidden="true"><use href="' + (icons[type] || '#i-bell') + '"/></svg>'
    }

    function hrefFor(n) {
      const data = n.data || {}
      if (n.type === 'KYC_VERIFIED' || n.type === 'KYC_REJECTED') return '/owner/kyc.html'
      if (n.type === 'BUSINESS_APPROVED' || n.type === 'BUSINESS_REJECTED' || n.type === 'BUSINESS_SUSPENDED') {
        return data.businessId ? '/owner/business-form.html?id=' + data.businessId : '/owner/dashboard.html'
      }
      if (n.type === 'NEW_MESSAGE') {
        return data.businessId ? '/owner/messages.html?businessId=' + data.businessId : '/owner/messages.html'
      }
      return '/notifications.html'
    }

    function itemHtml(n) {
      const dot = n.read ? '' : '<span class="mt-2 size-2 shrink-0 rounded-full bg-primary"></span>'
      return `
        <a href="${hrefFor(n)}" data-id="${n.id}" data-read="${n.read}" class="flex gap-3 px-5 py-4 transition hover:bg-muted">
          <span class="mt-0.5 flex size-9 shrink-0 items-center justify-center rounded-full bg-primary/15 text-primary">${icon(n.type)}</span>
          <span class="min-w-0 flex-1">
            <span class="block font-semibold">${escapeHtml(n.title)}</span>
            <span class="mt-0.5 block text-sm leading-snug text-muted-foreground">${escapeHtml(n.body)}</span>
            <span class="mt-1 block text-[11px] text-muted-foreground/70">${timeAgo(n.createdAt)}</span>
          </span>
          ${dot}
        </a>`
    }

    function render() {
      loading.classList.add('hidden')
      if (!notifications.length) {
        empty.classList.remove('hidden')
        list.classList.add('hidden')
        loadMore.classList.add('hidden')
        return
      }
      empty.classList.add('hidden')
      list.classList.remove('hidden')
      list.innerHTML = notifications.map(itemHtml).join('')
      loadMore.classList.toggle('hidden', !hasMore)
      markAllBtn.disabled = notifications.every((n) => n.read)
    }

    async function load(next) {
      if (next) page += 1
      else page = 1
      try {
        const { data } = await apiGet('/notifications?page=' + page)
        const items = data.notifications || []
        notifications = next ? notifications.concat(items) : items
        hasMore = data.hasMore
        setUnreadCount(data.unreadCount || 0)
        render()
      } catch (err) {
        loading.classList.add('hidden')
        empty.classList.remove('hidden')
        empty.innerHTML = '<h2 class="font-mono text-xl font-bold">Could not load notifications</h2><p class="mt-2 text-sm text-muted-foreground">' + escapeHtml(err.message || 'Please try again.') + '</p>'
      }
    }

    list.addEventListener('click', function (e) {
      const row = e.target.closest('[data-id]')
      if (!row) return
      if (row.dataset.read === 'false') {
        apiPatch('/notifications/' + row.dataset.id + '/read').catch(function () {})
        row.dataset.read = 'true'
        row.querySelector('.size-2')?.remove()
        setUnreadCount(getUnreadCount() - 1)
      }
    })

    markAllBtn.addEventListener('click', function () {
      apiPatch('/notifications/read-all').then(function () {
        setUnreadCount(0)
        notifications.forEach((n) => { n.read = true })
        render()
      }).catch(function (err) { alert(err.message || 'Failed to mark all read') })
    })

    document.getElementById('load-more-btn').addEventListener('click', function () { load(true) })

    load(false)
  </script>
</body>
</html>
